name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 后端测试（本仓库约定：必须显式覆盖 maven.test.skip）
      - name: Backend tests
        run: mvn test -Dmaven.test.skip=false -Dskip.frontend=true

      - name: Frontend unit tests
        run: cd frontend && npm ci && npm run test:unit -- --run

      # 前端类型检查 + 完整构建（vue-tsc 严格模式在 build 内执行）
      - name: Full build (backend + frontend)
        run: mvn clean install
