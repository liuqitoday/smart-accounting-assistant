<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2A33C"/>
      <stop offset="58%" stop-color="#ED6E2D"/>
      <stop offset="100%" stop-color="#E2551F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.27" cy="0.18" r="0.75">
      <stop offset="0%" stop-color="#FFE9C4" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#FFD9A0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#A63A12" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- full-bleed background: system applies its own mask -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- speech bubble with hand-flick tail, one merged silhouette -->
  <g filter="url(#lift)">
    <path fill="#FFFDF8" d="
      M 358 236
      L 666 236
      C 764 236, 844 316, 844 414
      L 844 522
      C 844 620, 764 700, 666 700
      L 486 700
      C 452 766, 372 812, 278 830
      C 316 782, 330 742, 328 696
      C 242 674, 180 604, 180 522
      L 180 414
      C 180 316, 260 236, 358 236
      Z"/>
  </g>

  <!-- ¥ : two diagonals meeting the stem, double crossbar, round hand strokes -->
  <g stroke="#D14C1D" stroke-width="62" stroke-linecap="round" fill="none">
    <path d="M 394 314 L 512 468"/>
    <path d="M 630 314 L 512 468"/>
    <path d="M 512 468 L 512 634"/>
    <path d="M 420 516 L 604 516"/>
    <path d="M 420 586 L 604 586"/>
  </g>
</svg>
