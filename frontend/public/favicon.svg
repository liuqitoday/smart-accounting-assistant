  <!-- speech bubble, simplified flick tail for tiny sizes -->
  <path fill="#FFFDF8" d="
    M 22.4 14.4
    L 41.6 14.4
    C 47.8 14.4, 52.8 19.4, 52.8 25.6
    L 52.8 32.4
    C 52.8 38.6, 47.8 43.6, 41.6 43.6
    L 30.4 43.6
    C 28.2 47.8, 23.2 50.6, 17.4 51.8
    C 19.8 48.8, 20.7 46.2, 20.5 43.3
    C 15.2 41.9, 11.2 37.5, 11.2 32.4
    L 11.2 25.6
    C 11.2 19.4, 16.2 14.4, 22.4 14.4
    Z"/>

  <!-- ¥ with strokes thickened and crossbars spread for 16px legibility -->
  <g stroke="#D14C1D" stroke-width="4.4" stroke-linecap="round" fill="none">
    <path d="M 24.6 19.2 L 32 28.9"/>
    <path d="M 39.4 19.2 L 32 28.9"/>
    <path d="M 32 28.9 L 32 39.8"/>
    <path d="M 26.2 31.9 L 37.8 31.9"/>
