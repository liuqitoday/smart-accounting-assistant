<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2A33C"/>
      <stop offset="58%" stop-color="#ED6E2D"/>
      <stop offset="100%" stop-color="#E2551F"/>
    </linearGradient>
  </defs>

  <!-- favicon shows unmasked in browser tabs: bake the rounding here -->
