services:
  app:
    build: .
    container_name: accounting-assistant
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
    environment:
      # Database（保留 WAL/busy_timeout 参数，与 application.yml 默认一致）
      - "SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/accounting-assistant.db?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL"

      # AI Service (Required)
      - SPRING_AI_OPENAI_API_KEY=${SPRING_AI_OPENAI_API_KEY}
      - SPRING_AI_OPENAI_BASE_URL=${SPRING_AI_OPENAI_BASE_URL:-https://api.openai.com}
      - SPRING_AI_OPENAI_MODEL=${SPRING_AI_OPENAI_MODEL:-gpt-3.5-turbo}

      # Security
      - REMEMBER_ME_KEY=${REMEMBER_ME_KEY}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}

      # Optional
      - SERVER_PORT=8081
      - SHOW_SQL=${SHOW_SQL:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/auth/csrf"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
